# dsh-mind 组合层
#
# ⚠️ 这里**只插入主插件本身**，不做别的。
#
# ⚠️ 压缩引擎的接入点不在这里，原因（2026-11-05 实测发现，很重要）：
#   Cordis 的 patch 分两层：**组合包层（bundle）** 与 **用户层（profile/home）**。
#   app-boot 文档原文：「你的 tweak 层，应用在所有组合包层**之后**」
#   —— 也就是用户层优先级更高，会覆盖组合包层。
#   所以在本文件写 `- id: compaction` 去替换 profile 里已有的那个 group，
#   会被 profile 自己的 `- id: compaction` **再覆盖回去**，等于白改、且无声。
#
#   因此那条替换只能写在：
#     `~/.dsh/profiles/<profile>/cordis.patch.yml` 的 `compaction` 组里
#   把 `- id: compaction-basic` 的 name 从
#     '@deepseek-ai/dsh-compaction-basic'
#   换成
#     'dsh-mind/compaction'
#
#   **代码全在 dsh-mind 包里**（lib/compaction.js），只有这一行"接线"必须在 profile 层。
#   这是 Cordis 分层的客观限制，不是取舍。
- insert:
    - id: dsh-mind
      name: dsh-mind
